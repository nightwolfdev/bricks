@let response = colorResponse | async;

@if (response) {

    <div class="swatch-container">
    @for (color of response.results; track color.id) {
        <div class="swatch">
            <div class="swatch-color" [style.backgroundColor]="'#' + color.rgb"></div>
            <div class="swatch-info">
                {{ color.name }}<br />
                #{{ color.rgb }}
            </div>
        </div>
    }
    </div>

} @else {
    <p>Loading colors...</p>
}
