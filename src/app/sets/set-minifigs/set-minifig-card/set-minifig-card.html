@let m = setMinifig();

<div class="card">
    <div>
        <a [routerLink]="['/minifigs', m.set_num]">
            <img [src]="setMinifigImage()" [alt]="m.set_name" />
        </a>
        <h2>
            <a [routerLink]="['/minifigs', m.set_num]">
                {{ m.set_name }}
            </a>
        </h2>
    </div>
    <div class="card-meta">
        <span>{{ m.set_num }}</span>
        <span>{{ m.quantity | number }} pcs</span>
    </div>
</div>
