<form [formGroup]="form" (ngSubmit)="onSubmit()">
    <input type="text" id="search" formControlName="search" placeholder="Search" />

    <select id="theme_id" formControlName="theme_id">
        <option value="">Any Theme</option>
        @for (theme of themes; track theme.id) {
            <option [value]="theme.id">{{ theme.name }}</option>
        }
    </select>

    <select id="ordering" formControlName="ordering">
        <option value="name">By Name</option>
        <option value="num_parts">By Number of Parts</option>
        <option value="-year">By Year</option>
    </select>
    
    <button type="submit">Search</button>
</form>
