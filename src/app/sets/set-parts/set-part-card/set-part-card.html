@let p = setPart();

<div class="card">
    <div>
        <a [routerLink]="['/parts', p.part.part_num]">
            <img [src]="setPartImage()" [alt]="p.part.name" />
        </a>
        <h2>
            <a [routerLink]="['/parts', p.part.part_num]">
                {{ p.part.name }}
            </a>
        </h2>
        <div class="card-meta">
            <span>{{ p.part.part_num }}</span>
            <span>{{ p.quantity | number }}</span>
        </div>
        <div class="card-meta">
            <span>{{ setPartCategory()?.name }}</span>
        </div>  
    </div>  
</div>
