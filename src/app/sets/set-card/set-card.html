@let s = set();

<div class="card">
    <div>
        <a [routerLink]="['/sets', s.set_num]">
            <img [src]="setImage()" [alt]="s.name" />
        </a>
        <h2>
            <a [routerLink]="['/sets', s.set_num]">
                {{ s.name }}
            </a>
        </h2>
        <div class="card-meta">
            <span>{{ s.set_num }}</span>
            <span>{{ s.num_parts | number }} pcs</span>
        </div>
        <div class="card-meta">
            <span>{{ setTheme()?.name }}</span>
            <span>{{ s.year }}</span>
        </div>
    </div>
    <div class="card-actions">
        <a target="_blank" [href]="'https://www.brickeconomy.com/set/' + s.set_num + '/'">BrickEconomy</a>
        <a target="_blank" [href]="'https://www.bricklink.com/catalogPG.asp?S=' + s.set_num">BrickLink</a>
    </div>
</div>
