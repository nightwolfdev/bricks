@let p = part();

<div class="card">
    <div>
        <a [routerLink]="['/parts', p.part_num]">
            <img [src]="partImage()" [alt]="p.name" />
        </a>
        <h2>
            <a [routerLink]="['/parts', p.part_num]">
                {{ p.name }}
            </a>
        </h2>
    </div>
    <div class="card-meta">
        <span>{{ p.part_num }}</span>
        <span>{{ partCategory()?.name }}</span>
    </div>
</div>
