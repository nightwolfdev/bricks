@let m = minifig();

<div class="card">
    <div>
        <a [routerLink]="['/minifigs', m.set_num]">
            <img [src]="minifigImage()" [alt]="m.name" />
        </a>
        <h2>
            <a [routerLink]="['/minifigs', m.set_num]">
                {{ m.name }}
            </a>
        </h2>
    </div>
    <div class="card-meta">
        <span>{{ m.set_num }}</span>
        <span>{{ m.num_parts | number }} pcs</span>
    </div>
</div>
